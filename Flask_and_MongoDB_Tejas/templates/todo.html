<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body { font-family: sans-serif; max-width: 450px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background: #00684A; color: white; border: none; cursor: pointer; }
        .status { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
        .success { background: #dcfce7; color: #166534; }
        .error { background: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body>
    <h2>Add To-Do Item</h2>
    <div id="status-box" class="status"></div>

    <form id="todoForm">
        <div class="form-group">
    <label for="itemId">Item ID:</label>
    <input type="text" id="itemId" name="itemId" required>
</div>
        <div class="form-group">
            <label for="itemName">Item Name:</label>
            <input type="text" id="itemName" name="itemName" required>
        </div>
        <div class="form-group">
            <label for="itemDescription">Item Description:</label>
            <textarea id="itemDescription" name="itemDescription" rows="4" required></textarea>
        </div>
        <button type="submit">Add Item</button>
    </form>

    <script>
        const form = document.getElementById('todoForm');
        const statusBox = document.getElementById('status-box');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            statusBox.style.display = 'none';

            const itemName = document.getElementById('itemName').value;
            const itemDescription = document.getElementById('itemDescription').value;

            try {
                const response = await fetch('http://127.0.0', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ itemName, itemDescription ,itemId })
                });

                const result = await response.json();

                statusBox.textContent = response.ok ? result.message : (result.error || 'Failed to add item.');
                statusBox.className = `status ${response.ok ? 'success' : 'error'}`;
                statusBox.style.display = 'block';

                if (response.ok) form.reset();
            } catch (err) {
                statusBox.textContent = 'Could not connect to the backend.';
                statusBox.className = 'status error';
                statusBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
